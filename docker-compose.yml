services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: harness_factory
      POSTGRES_USER: hf
      POSTGRES_PASSWORD: hf
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hf -d harness_factory"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - backend

  api:
    image: harness-factory-web-api:local
    build:
      context: .
      dockerfile: web/api/Dockerfile
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-}
        UV_LOCK_FILE: ${UV_LOCK_FILE:-uv.lock}
    environment:
      HF_AUTH_MODE: development
      HF_ALLOW_INSECURE_DEVELOPMENT_AUTH: "true"
      HF_DEVELOPMENT_ORGANIZATION_ID: local-dev
      HF_DEVELOPMENT_SUBJECT_ID: portal-dev
      HF_DEVELOPMENT_ROLES: author,reviewer,registry-admin,developer,org-admin
      HF_DATABASE_URL: postgresql+psycopg://hf:hf@postgres:5432/harness_factory
      HF_CATALOG_ROOT: /app/catalog
      HF_ARTIFACT_ROOT: /artifacts
    command:
      [
        "sh",
        "-c",
        "alembic upgrade head && python -m web.api.organizations.bootstrap && uvicorn web.api.main:create_app --factory --host 0.0.0.0 --port 8000",
      ]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import json, urllib.request; data = json.load(urllib.request.urlopen('http://127.0.0.1:8000/api/health')); raise SystemExit(0 if data.get('ok') is True else 1)",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - hf-artifacts:/artifacts
    networks:
      - backend
      - frontend

  worker:
    image: harness-factory-web-api:local
    build:
      context: .
      dockerfile: web/api/Dockerfile
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-}
        UV_LOCK_FILE: ${UV_LOCK_FILE:-uv.lock}
    environment:
      HF_AUTH_MODE: development
      HF_ALLOW_INSECURE_DEVELOPMENT_AUTH: "true"
      HF_DEVELOPMENT_ORGANIZATION_ID: local-dev
      HF_DEVELOPMENT_SUBJECT_ID: portal-dev
      HF_DEVELOPMENT_ROLES: author,reviewer,registry-admin,developer,org-admin
      HF_DATABASE_URL: postgresql+psycopg://hf:hf@postgres:5432/harness_factory
      HF_CATALOG_ROOT: /app/catalog
      HF_ARTIFACT_ROOT: /artifacts
    command:
      [
        "sh",
        "-c",
        "python -m web.api.organizations.bootstrap && python -m web.api.builds.worker",
      ]
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - hf-artifacts:/artifacts
    networks:
      - backend

  portal:
    build:
      context: ./web/portal
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_HF_AUTH_MODE: development
      HF_API_BASE_URL: http://api:8000
      HF_DEV_ORGANIZATION: local-dev
      HF_DEV_SUBJECT: portal-dev
      HF_DEV_ROLES: author,reviewer,registry-admin,developer,org-admin
      AUTH_SECRET: local-development-auth-secret
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000').then((response) => { if (!response.ok) throw new Error(String(response.status)); }).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - frontend

volumes:
  postgres-data:
  hf-artifacts:

networks:
  backend:
    internal: true
  frontend:
